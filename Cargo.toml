[workspace]
resolver = "3"
members = ["crates/trustvault-core", "src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# 1.88, not 1.85. The lower figure held `cargo update` back to versions that still carried
# RUSTSEC-2026-0009 (time) and RUSTSEC-2026-0194/0195 (quick-xml, via plist) — an MSRV set
# below what the patched dependencies require is an MSRV that blocks security updates.
# Raise this when a patch needs it; do not raise it for taste.
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Sulfikardi"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# The only dependency D-42 cost. A Bitwarden export is JSON and nothing else in the vault
# format is — the body is CBOR (D-10) — so this crate is here for the importer alone.
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

# Phase 1 cryptography. Every one of these is justified in the decision log (D-21…D-24);
# the short version is that they are the RustCrypto implementations, they are pure Rust so
# they cross-compile to all three targets without a C toolchain, and the AEAD has an NCC
# Group audit behind it. Versions are pinned to a minor because a silent algorithm change
# in any of them is a format break.
# "alloc" is required: `hash_password_into` lives behind it. It also pulls `password-hash`
# (and base64ct and rand_core with it), which this crate never calls — argon2 0.5 offers no
# way to take the raw KDF without the PHC-string layer. Revisit at argon2 0.6, whose `kdf`
# feature separates the two; it is a release candidate as of 2026-08-02 and a Tier-1 crate
# does not ship an RC of its key derivation.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
ciborium = "0.2.2"
data-encoding = "2.11"
getrandom = "0.4"
subtle = "2.6"

# Phase 3, D-54: the primitives under RFC 6238. The same RustCrypto family as the three
# above, and taken as primitives rather than as a TOTP crate — the RFC publishes its own
# test vectors, so the 40 lines above HMAC are pinned by upstream's numbers.
# `zeroize` is on for all three and is the reason the 0.13/0.11 line was chosen over the
# 0.12/0.10 one: the HMAC state holds the seed, and N-01 wants it wiped on drop. The cost is
# `digest 0.11` beside the `digest 0.10` argon2 pulls through blake2, until argon2 0.6.
hmac = { version = "0.13", features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
uuid = { version = "1", features = ["v4", "serde"] }

# D-12, decided at kickoff: the design's crack-time strings ("takes ~8 centuries to crack") are
# zxcvbn's own output format, so anything else means reimplementing its phrasing.
#
# **In the core since D-78**, not in `src-tauri`. The original reason it was in the host — the
# ~400 kB of dictionaries against S-01's 800 ms cold start — was an argument against the
# *webview* and is untouched by the move. What decides between host and core is that scoring
# every password means reading every password, and the core is where they already are. N-02 is
# unaffected: nothing in this tree is Tauri, a webview, or a socket.
zxcvbn = { version = "3.1", default-features = false }

# Release profile. A password manager spends its life idle in the dock, so size and
# startup (S-01, S-06) matter more than throughput.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Debug assertions stay on in the dev profile for the core crate's invariants.
[profile.dev]
debug = true

# Dependencies are compiled with optimization even in dev and test builds. Unoptimized
# Argon2 and XChaCha20 are roughly two orders of magnitude slower, which turns the
# byte-mutation test (R-04, several thousand decryptions) from seconds into an hour and makes
# the whole suite something people skip. Our own crates stay unoptimized and debuggable.
[profile.dev.package."*"]
opt-level = 2

# Coverage runs (N-03, >= 90 % on trustvault-core) need three things at once: optimized
# cryptography, or the byte-mutation test's thousands of decryptions take hours under
# instrumentation; unwinding, because proptest catches panics to shrink a failing case and
# `panic = "abort"` would turn a shrinkable failure into a bare abort; and no LTO, because
# instrumented LTO builds are slow to link and gain nothing here.
[profile.coverage]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
panic = "unwind"
strip = false
debug = true
