name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run fmt:check
      - name: Types
        run: npm run check

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev build-essential pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  boundary:
    name: Vault core isolation (N-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # trustvault-core owns every plaintext byte. If it can reach Tauri, a webview, or a
      # network stack, the security boundary described in trustvault-requirements.md stops
      # being structural and becomes a convention. This job is what makes it structural.
      - name: Assert the core depends on no UI, Tauri, or network crate
        run: |
          tree=$(cargo tree -p trustvault-core --edges normal --prefix none)
          echo "$tree"
          if echo "$tree" | grep -Eiq '^(tauri|wry|tao|reqwest|hyper|ureq|tokio|axum)'; then
            echo "::error::trustvault-core gained a forbidden dependency — see N-02"
            exit 1
          fi
      # The other half of the boundary, and the half no Rust test can see. `ipc_session.rs`
      # proves what the host *sends*; this proves there is exactly one place the webview can
      # ask from. src/lib/ipc.ts is the single file a reviewer reads to answer "what can reach
      # plaintext from here", and a stray `invoke` anywhere else makes that answer wrong.
      - name: Assert the webview reaches IPC through one file only (R-10)
        run: |
          strays=$(grep -rln "invoke(" src --include='*.ts' --include='*.svelte' \
            | grep -v '^src/lib/ipc.ts$' || true)
          if [ -n "$strays" ]; then
            echo "$strays"
            echo "::error::invoke() is called outside src/lib/ipc.ts — every IPC call goes through that file (R-10)"
            exit 1
          fi

  nonce:
    name: Nonce discipline (R-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # R-06: every AEAD nonce comes from the OS CSPRNG, never a counter. The structural
      # defence is that `aead::random` is the crate's only source of randomness and there is
      # no seeded generator to reach for; this job fails the build if one appears. A reviewer
      # can miss a `rand::thread_rng()` added in a hurry — grep cannot.
      - name: Assert the core has no seeded random number generator
        run: |
          if grep -REn 'rand::|thread_rng|StdRng|ChaChaRng|SmallRng|from_seed|seed_from_u64' \
              crates/trustvault-core/src; then
            echo "::error::trustvault-core reached for a seedable RNG — nonces must come from the OS CSPRNG (R-06)"
            exit 1
          fi
      - name: Assert the CSPRNG is called from exactly one place
        run: |
          calls=$(grep -REc 'getrandom::' crates/trustvault-core/src | grep -v ':0$' || true)
          echo "$calls"
          files=$(echo "$calls" | grep -c . || true)
          if [ "$files" != "1" ]; then
            echo "::error::getrandom is called from $files files; it must be confined to src/aead.rs (R-06)"
            exit 1
          fi
          echo "$calls" | grep -q '^crates/trustvault-core/src/aead.rs:' || {
            echo "::error::the CSPRNG call moved out of src/aead.rs (R-06)"
            exit 1
          }

  coverage:
    name: Vault core coverage (N-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # N-03 is >= 90 % on the core crate, and the threshold is enforced here rather than
      # reported: a coverage number nobody fails on is a number nobody reads. The dedicated
      # `coverage` profile in Cargo.toml exists because instrumented *unoptimized* Argon2 turns
      # the byte-mutation test from seconds into hours.
      - name: Coverage
        run: |
          cargo llvm-cov --profile coverage -p trustvault-core \
            --fail-under-lines 90 --summary-only

  audit:
    name: Dependency audit (N-04)
    runs-on: ubuntu-latest
    # The action publishes its findings as a check run, which the default read-only
    # GITHUB_TOKEN cannot create — without this the job fails with
    # "Resource not accessible by integration" no matter what the audit itself found.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Policy lives in .cargo/audit.toml: vulnerabilities always fail, and the handful of
      # advisories we cannot act on are ignored there individually, each with its reason and
      # the condition that retires it.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.os }}
    # Unsigned builds on all three platforms from Phase 0, so the runners are known to work
    # long before Phase 5 layers signing and notarization on top of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev build-essential pkg-config
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --no-bundle
