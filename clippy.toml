# trustvault-core denies unwrap, expect, and panic in library code (Tier 1 — a panic there
# is unrecoverable data loss). Tests are the exception: assert! and friends expand to panics,
# and a test that cannot panic cannot fail.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Same reasoning for slicing: a test that walks a byte layout is clearer written as
# `bytes[4..6]` than as a chain of `split_at_checked`. Library code still has to earn it.
allow-indexing-slicing-in-tests = true
