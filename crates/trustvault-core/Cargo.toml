[package]
name = "trustvault-core"
description = "TrustVault vault format and cryptography. No UI, no Tauri, no I/O beyond the vault file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# N-02: this crate must not depend on Tauri, on any UI crate, or on a network stack.
# Enforced by a CI check, not by good intentions. Crypto dependencies arrive in Phase 1
# (see phases/phase-1-vault-core.md) — Phase 0 deliberately ships no cryptography.
[dependencies]
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Tests only. The vault body itself is CBOR (decision D-10) — JSON is used here purely to
# assert that the serde field names, which are part of the on-disk format, stay stable.
serde_json = "1"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
# The core is Tier 1 (trustvault-requirements.md). A panic here is data loss, so the
# panicking constructs are denied rather than discouraged.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
